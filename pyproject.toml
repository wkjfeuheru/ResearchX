[build-system]
requires = ["hatchling", "pydantic>=2.0.0", "pyyaml>=6.0"]
build-backend = "hatchling.build"

[project]
name = "researchx-ai"
version = "0.1.9"
description = "Investment research workspace with session-isolated evidence and agent infrastructure"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [
    { name = "novix-science" },
]

dependencies = [
    "anthropic>=0.40.0",
    "openai>=1.0.0",
    "tiktoken>=0.8.0",
    "rich>=13.0.0",
    "typer>=0.12.0",
    "pydantic>=2.0.0",
    "httpx>=0.27.0",
    "async-timeout>=4.0,<6; python_version < '3.11'",
    "websockets>=12.0",
    "mcp>=1.0.0,<2.0.0",
    "jsonschema>=4.26,<5",
    "referencing>=0.37,<0.38",
    "pyyaml>=6.0",
    "questionary>=2.0.1",
    "pypdf>=5.0,<7",
    "python-docx>=1.1,<2",
    "openpyxl>=3.1,<4",
    "sqlalchemy[asyncio]>=2.0,<3",
    "asyncpg>=0.30,<1",
    "alembic>=1.14,<2",
]

[project.optional-dependencies]
eval = [
    "langfuse>=4.10,<5",
]
web = [
    "fastapi>=0.115.0",
    "uvicorn>=0.30.0",
    "python-multipart>=0.0.20",
]
dev = [
    "pexpect>=4.9.0",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.5.0",
    "mypy>=1.10.0",
    "types-PyYAML",
    "types-openpyxl",
    "types-python-dateutil",
    "types-pexpect",
    "distro",
    "keyring",
    "hatchling>=1.27",
]
s3 = [
    "boto3>=1.35,<2",
]

[project.scripts]
rx = "researchx.cli:app"
oh = "researchx.cli:app"
openh = "researchx.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/researchx"]

[tool.hatch.build]
exclude = [
    "/.git",
    "/.venv",
    "/.researchx-venv",
    "/.researchx",
    "/.pytest_cache",
    "/.mypy_cache",
    "/.ruff_cache",
    "/build",
    "/dist",
]

[tool.hatch.build.hooks.custom]
path = "hatch_build.py"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.mypy]
python_version = "3.11"
strict = true
